<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מונדרי בפולין - סיכום טיול</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Assistant', sans-serif; background-color: #f7f9f9; margin: 0; padding: 20px 10px; display: flex; justify-content: center; color: #333; }
        .container { max-width: 500px; width: 100%; display: flex; flex-direction: column; min-height: 90vh; }
        
        /* Header section */
        .header { text-align: center; margin-bottom: 30px; }
        .logo { width: 130px; height: 130px; border-radius: 50%; border: 4px solid #008B8B; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .main-title { color: #8B4513; font-size: 28px; font-weight: 800; margin: 15px 0 0 0; }
        .subtitle { color: #2E8B57; font-size: 18px; font-weight: 600; margin: 5px 0 0 0; }
        
        /* Welcome Back section */
        .welcome-back { text-align: center; margin: 40px 0; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .welcome-back h2 { color: #008B8B; font-size: 36px; font-weight: 800; margin-bottom: 15px; line-height: 1.2; }
        .welcome-back p { color: #8B4513; font-size: 24px; font-weight: 600; margin-top: 0; line-height: 1.4; }
        
        /* Feedback Form section */
        .feedback-container { background-color: white; border-radius: 12px; padding: 25px 20px; box-shadow: 0 3px 15px rgba(0,0,0,0.08); border-top: 6px solid #2E8B57; margin-bottom: 30px; }
        .feedback-container h3 { color: #2E8B57; margin-top: 0; font-size: 19px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; justify-content: center; }
        textarea { width: 100%; min-height: 130px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Assistant', sans-serif; font-size: 16px; resize: vertical; margin-bottom: 18px; background-color: #fafafa; transition: border-color 0.3s; }
        textarea:focus { outline: none; border-color: #008B8B; background-color: #fff; box-shadow: 0 0 5px rgba(0,139,139,0.2); }
        .send-wa-btn { background-color: #25D366; color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 25px; font-weight: 700; font-size: 17px; font-family: 'Assistant', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
        .send-wa-btn:active { opacity: 0.8; transform: scale(0.98); }
        
        /* Footer section */
        .footer { text-align: center; padding: 20px 10px; border-top: 1px solid #ddd; margin-top: auto; }
        .footer-line1 { font-size: 16px; font-weight: bold; color: #008B8B; margin-bottom: 5px; display: block; }
        .footer-line2 { font-size: 12px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="header">
        <img src="1.jpg" alt="Logo" class="logo">
        <h1 class="main-title">מונדרי בפולין</h1>
        <h2 class="subtitle">2-11/8/2026</h2>
    </div>

    <!-- Welcome Back Message -->
    <div class="welcome-back">
        <h2>איזה כיף שנהניתם!</h2>
        <p>נתראה בטיול הבא,<br>הדס</p>
    </div>

    <!-- Feedback Form -->
    <div class="feedback-container">
        <h3><i class="fa-solid fa-pen-to-square"></i> אשמח לשמוע איך היה!</h3>
        <textarea id="feedbackText" placeholder="ספרו קצת על החוויות שלכם, מה אהבתם, וכמובן אם יש הצעות לשיפור לטיול הבא..."></textarea>
        <button class="send-wa-btn" onclick="sendWhatsApp()">
            <i class="fa-brands fa-whatsapp fa-lg"></i> שליחת חוות דעת לוואטסאפ
        </button>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span class="footer-line1">כל הזכויות שמורות להדס טרכטר - יועצת טיולים בארץ ובעולם 050-5685356</span>
        <span class="footer-line2">אין להעביר ללא אישור מפורש. העובר על כך עובר על גזל לפי דין תורה וחוקי המקום.</span>
    </div>

</div>

<!-- WhatsApp Script -->
<script>
    function sendWhatsApp() {
        var feedback = document.getElementById('feedbackText').value;
        if(feedback.trim() === '') {
            alert('אנא כתבו כמה מילים לפני השליחה :)');
            return;
        }
        // הפורמט של המספר חייב להיות בינלאומי ללא פלוס וקידומת 0
        var phoneNumber = "972505685356"; 
        
        // בניית ההודעה שתישלח
        var message = encodeURIComponent("היי הדס, הנה חוות הדעת שלי על הטיול פולין-סלובקיה:\n\n" + feedback);
        
        // פתיחת הקישור לוואטסאפ (יפתח את האפליקציה בנייד או את WhatsApp Web במחשב)
        var waUrl = "https://wa.me/" + phoneNumber + "?text=" + message;
        window.open(waUrl, '_blank');
    }
</script>

</body>
</html>
